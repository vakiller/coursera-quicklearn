<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Sync khóa học → Obsidian</title>
    <style>
      body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #222; }
      h1 { font-size: 20px; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
      label { display: inline-block; margin-right: 16px; }
      button { padding: 8px 14px; font-size: 14px; cursor: pointer; margin-right: 8px; }
      progress { width: 100%; height: 14px; }
      #current { color: #555; font-size: 13px; min-height: 1.2em; }
      #report { white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 8px; }
      .warn { color: #a15c00; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Sync khóa học → Obsidian</h1>
    <p>Khóa: <strong id="slug"></strong> · Giữ tab Coursera mở trong lúc sync.</p>
    <fieldset>
      <legend>Vault</legend>
      <p id="vault">Chưa chọn thư mục vault.</p>
      <button id="pick">Chọn thư mục vault</button>
    </fieldset>
    <fieldset>
      <legend>Tùy chọn</legend>
      <label>Ngôn ngữ transcript
        <select id="lang"><option value="en" selected>English</option><option value="vi">Tiếng Việt</option></select>
      </label>
      <label>Độ trễ giữa request (ms) <input id="delay" type="number" min="200" step="100" value="700" style="width: 80px" /></label>
    </fieldset>
    <button id="start" disabled>Bắt đầu sync</button>
    <button id="zip">Tải ZIP thay vì ghi vào vault</button>
    <p><progress id="bar" value="0" max="1"></progress></p>
    <p id="current"></p>
    <div id="report" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
